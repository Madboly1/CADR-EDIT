name: Build CADR EDIT EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build CADR EDIT EXE
        run: cargo build --release --bin cadr-edit

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CADR-EDIT-Windows
          path: target/release/cadr-edit.exe
