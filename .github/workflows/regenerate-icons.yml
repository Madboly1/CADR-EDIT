name: Regenerate CADR Studio icons

on:
  push:
    branches: [cadr/development]
    paths:
      - "assets/app-icon/filmcraft.svg"
      - "assets/app-icon/filmcraft-small.svg"
      - "packaging/icons.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-icons:
    runs-on: macos-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: cadr/development
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install icon renderer
        run: brew install resvg

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate platform icon assets
        run: bash packaging/icons.sh

      - name: Commit generated icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-icon apps/filmcraft-web/web/favicon.png
          if git diff --cached --quiet; then
            echo "Icon assets are already up to date."
          else
            git commit -m "Regenerate CADR Studio platform icons"
            git push origin HEAD:cadr/development
          fi
