name: CADR Studio Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (empty uses Cargo.toml, currently 0.20.1)"
        required: false
        type: string
        default: ""
      draft:
        description: "Create as draft release instead of publishing immediately"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cadr-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows x64 executable, installer and portable package
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cadr-release-windows-x64

      - name: Install WiX 5
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version -and $env:REF_TYPE -eq 'tag' -and $env:REF_NAME) {
            $version = $env:REF_NAME -replace '^[vV]', ''
          }
          if (-not $version) {
            $inPackage = $false
            foreach ($line in Get-Content Cargo.toml) {
              if ($line -match '^\s*\[') {
                $inPackage = ($line.Trim() -eq '[workspace.package]')
                continue
              }
              if ($inPackage -and $line -match '^\s*version\s*=\s*"([^"]+)"') {
                $version = $Matches[1]
                break
              }
            }
          }
          if (-not $version -or $version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and package Windows x64
        shell: pwsh
        env:
          FILMCRAFT_VERSION: ${{ steps.version.outputs.version }}
          FILMCRAFT_BUILD_SHA: ${{ github.sha }}
          FILMCRAFT_BUILD_DATE: ${{ github.run_started_at }}
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          pwsh packaging/windows/package.ps1 -Arch x64
          $exeSource = "target\windows-package\x64\filmcraft.exe"
          if (-not (Test-Path -LiteralPath $exeSource)) {
            $exeSource = "target\x86_64-pc-windows-msvc\release\filmcraft.exe"
          }
          Copy-Item -LiteralPath $exeSource -Destination "dist\release\CADR-Studio-windows-x86_64.exe" -Force
          Get-ChildItem -LiteralPath "dist\release" -File | Format-Table Name, Length

      - name: Upload Windows packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: cadr-studio-windows-x64-${{ steps.version.outputs.version }}
          path: |
            dist/release/*.exe
            dist/release/*.msi
            dist/release/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Attach Windows assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          IS_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
        run: |
          $tag = "v$env:VERSION"
          $assets = @(
            Get-ChildItem -LiteralPath "dist/release" -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in '.exe', '.msi', '.zip' } |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          if ($assets.Count -eq 0) {
            throw "No release assets (.exe/.msi/.zip) found in dist/release"
          }
          Write-Output "Attaching $($assets.Count) release asset(s) to ${tag}:"
          $assets | ForEach-Object { Write-Output "  - $_" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed uploading Windows assets to release $tag" }
          } else {
            $args = @("release", "create", $tag) + $assets + @("--title", "CADR Studio $env:VERSION", "--generate-notes")
            if ($env:IS_DRAFT -eq 'true') {
              $args += "--draft"
            }
            & gh @args
            if ($LASTEXITCODE -ne 0) { throw "Failed creating GitHub release $tag" }
          }
